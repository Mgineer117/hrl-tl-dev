algo_config:
  algorithm: sb3_soft.SDSAC
  algo_kwargs:
    policy: MultiInputPolicy
    learning_rate: 0.000945
    buffer_size: 1_000_000
    learning_starts: 10000
    batch_size: 1000
    tau: 0.000392
    gamma: 0.99
    train_freq: 9
    gradient_steps: 42
    replay_buffer_class: null
    optimize_memory_usage: false
    n_steps: 1
    ent_coef: auto_0.001
    target_update_interval: 7
    target_entropy: 0.25
    beta: 0.983
    clip_range: 0.952
    stats_window_size: 100
    policy_kwargs:
      net_arch: [512, 512, 512]
    verbose: 1

learn_config:
  total_timesteps: 40_000_000
  progress_bar: true

vec_config:
  n_envs: 200
  vec_env_cls: SubprocVecEnv
  vec_env_kwargs: { "start_method": "spawn" }

callback_config:
  eval_callback_config:
    eval_freq: 2_500
    n_eval_episodes: 100
    log_path: eval

  ckpt_callback_config:
    save_freq: 100_000
    save_path: ckpts
    name_prefix: ckpt
    save_replay_buffer: false
    verbose: 0

  video_recorder_callback_config:
    render_freq: 20_000
    save_dir: ckpts
    name_prefix: video
