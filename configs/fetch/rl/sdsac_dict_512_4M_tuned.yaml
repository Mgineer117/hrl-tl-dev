algo_config:
  algorithm: sb3_soft.SDSAC
  algo_kwargs:
    policy: MultiInputPolicy
    learning_rate: 0.000231
    buffer_size: 1_000_000
    learning_starts: 10000
    batch_size: 2000
    tau: 0.193
    gamma: 0.99
    train_freq: 24
    gradient_steps: 34
    replay_buffer_class: null
    optimize_memory_usage: false
    n_steps: 1
    ent_coef: auto_0.005
    target_update_interval: 10
    target_entropy: 0.00424
    beta: 0.604
    clip_range: 0.731
    stats_window_size: 100
    policy_kwargs:
      net_arch: [512, 512, 512]
    verbose: 1

learn_config:
  total_timesteps: 4_000_000
  progress_bar: true

vec_config:
  n_envs: 50
  vec_env_cls: SubprocVecEnv
  vec_env_kwargs: { "start_method": "spawn" }

callback_config:
  eval_callback_config:
    eval_freq: 2_500
    n_eval_episodes: 100
    log_path: eval

  ckpt_callback_config:
    save_freq: 10_000
    save_path: ckpts
    name_prefix: ckpt
    save_replay_buffer: false
    verbose: 0

  video_recorder_callback_config:
    render_freq: 10_000
    save_dir: ckpts
    name_prefix: video
