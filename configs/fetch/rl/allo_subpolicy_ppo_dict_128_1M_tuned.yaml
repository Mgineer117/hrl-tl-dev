algo_config:
  algorithm: PPO
  algo_kwargs:
    policy: MultiInputPolicy
    learning_rate: 2.17e-04
    n_steps: 40
    batch_size: 2000
    n_epochs: 20
    gamma: 0.941
    gae_lambda: 0.921
    clip_range: 0.022
    clip_range_vf: null
    ent_coef: 0.017
    vf_coef: 0.817
    max_grad_norm: 0.674
    use_sde: false
    sde_sample_freq: -1
    rollout_buffer_class: null
    rollout_buffer_kwargs: null
    target_kl: null
    stats_window_size: 100
    policy_kwargs:
      net_arch: [128, 128, 128]
    verbose: 1

learn_config:
  total_timesteps: 1_000_000
  progress_bar: true

vec_config:
  n_envs: 25
  vec_env_cls: SubprocVecEnv
  vec_env_kwargs: { "start_method": "spawn" }

callback_config:
  eval_callback_config:
    eval_freq: 2_000
    n_eval_episodes: 100
    log_path: eval

  ckpt_callback_config:
    save_freq: 20_000
    save_path: ckpts
    name_prefix: ckpt
    save_replay_buffer: false
    verbose: 0

  video_recorder_callback_config:
    render_freq: 20_000
    save_dir: ckpts
    name_prefix: video
