algo_config:
  algorithm: sb3_soft.SDSAC
  algo_kwargs:
    policy: MultiInputPolicy
    learning_rate: 0.000216
    buffer_size: 1_000_000
    learning_starts: 10000
    batch_size: 4000
    tau: 0.0421
    gamma: 0.99
    train_freq: 7
    gradient_steps: 13
    replay_buffer_class: null
    optimize_memory_usage: false
    n_steps: 1
    ent_coef: auto_0.005
    target_update_interval: 18
    target_entropy: 0.221
    beta: 0.984
    clip_range: 0.159
    stats_window_size: 100
    policy_kwargs:
      net_arch: [512, 512, 512]
    verbose: 1

learn_config:
  total_timesteps: 10_000_000
  progress_bar: true

vec_config:
  n_envs: 35
  vec_env_cls: SubprocVecEnv
  vec_env_kwargs: { "start_method": "spawn" }

callback_config:
  eval_callback_config:
    eval_freq: 4_000
    n_eval_episodes: 100
    log_path: eval

  ckpt_callback_config:
    save_freq: 40_000
    save_path: ckpts
    name_prefix: ckpt
    save_replay_buffer: false
    verbose: 0

  video_recorder_callback_config:
    render_freq: 40_000
    save_dir: ckpts
    name_prefix: video
