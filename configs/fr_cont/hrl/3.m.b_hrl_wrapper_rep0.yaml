spec_rep_class: hrl_tl.wrappers.utils.spec_rep.CPCParamLv1MinimalSpecRep
spec_rep_args:
  num_clauses: 1
  args:
    L_gain:
      range: [11.56, 60.40]
      num_discrete_bins: 15
    k_steepness:
      range: [0.548, 1.41]
      num_discrete_bins: 15
    eps_margin:
      range: [1.95, 5.45]
      num_discrete_bins: 10
low_level_policy_class: hrl_tl.wrappers.low_level_policies.cpc.CPCLowLevelPolicy
low_level_policy_args:
  model_path: out/fr_cont/cpc/pr/3.l.b/cpc_10.0M/rep_0/best_model.zip
  var_value_info_generator_cls: hrl_tl.envs.tl_fourroom.ContRoomsObsVarValueInfoGenerator
  algo: SDSAC
  device: cuda:0
  goal_rep: one_hot
  verbose: false
max_low_level_policy_steps: 51
all_formulae_file_path: assets/formulae/fourroom/all_formulae_1_cla_1_max_pred_core.json
invalid_tl_action: random
tl_wrapper_args: configs/fr_cont/gcltl/wrapper/tl_wrapper_0.35.yaml
verbose: false
