spec_rep_class: hrl_tl.wrappers.utils.spec_rep.CPCParamLv1MinimalSpecRep
spec_rep_args:
  num_clauses: 1
  args:
    L_gain:
      range: [0.0, 10.0]
      num_discrete_bins: 11
    k_steepness:
      range: [0.1, 5.0]
      num_discrete_bins: 11
    eps_margin:
      range: [0.0, 0.5]
      num_discrete_bins: 11
low_level_policy_class: hrl_tl.wrappers.low_level_policies.cpc.CPCLowLevelPolicy
low_level_policy_args:
  model_path: out/fr_cont/gcltl/pr/3.e.q/gcltl_5.0M/best_model.zip
  var_value_info_generator_cls: hrl_tl.envs.tl_fourroom.ContRoomsObsVarValueInfoGenerator
  lambda_config:
    L_gain: 5.0
    k_steering: 3.0
    eps_margin: 0.1
  device: cuda:3
  verbose: false
max_low_level_policy_steps: 75
all_formulae_file_path: assets/formulae/fourroom/all_formulae_1_cla_1_max_pred_core.json
invalid_tl_action: random
tl_wrapper_args: configs/fr_cont/gcltl/wrapper/tl_wrapper_0.4.yaml
verbose: false
