algo_config:
  algorithm: TQC
  algo_kwargs:
    policy: MultiInputPolicy
    learning_rate: 0.0003
    buffer_size: 1_000_000
    learning_starts: 100
    batch_size: 20_000
    tau: 0.005
    gamma: 0.99
    train_freq: 8
    gradient_steps: 10
    action_noise: null
    replay_buffer_class: null
    optimize_memory_usage: false
    n_steps: 1 # int(batch_size / n_envs) - needs to be calculated
    ent_coef: auto
    target_update_interval: 1
    target_entropy: auto
    top_quantiles_to_drop_per_net: 2
    use_sde: false
    sde_sample_freq: -1
    use_sde_at_warmup: false
    stats_window_size: 100    
    policy_kwargs:
      net_arch: [512, 512, 512]
    verbose: 1

learn_config:
  total_timesteps: 40_000_000
  progress_bar: true

vec_config:
  n_envs: 50
  vec_env_cls: SubprocVecEnv
  vec_env_kwargs: { "start_method": "spawn" }

callback_config:
  eval_callback_config:
    eval_freq: 5_000
    n_eval_episodes: 100
    log_path: eval

  ckpt_callback_config:
    save_freq: 20_000
    save_path: ckpts
    name_prefix: ckpt
    save_replay_buffer: false
    verbose: 0

  video_recorder_callback_config:
    render_freq: 20_000
    save_dir: ckpts
    name_prefix: video
