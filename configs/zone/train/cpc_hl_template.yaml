replicate_config:
  num_replicates: 5
  replicate_start_id: 0
  replicate_signature: rep_{rep_id}

single_pipeline_config:
  device: 0
  experiment_id: cpc_hl_zone
  retrain_model: true
  save_config:
    models_dir: out/zone/cpc_hl
    model_name: hl_policy_zone
    model_filename: final_model.zip
    best_model_filename: best_model.zip
    monitor_dir: monitor
    tb_dir: tb
    eval_dir: eval
    eval_metrics_filename: eval.yaml
    animation_dir: animations
    animation_ext: gif
  config_dir: configs/zone
  env_config_file: env/button/button_ang8_vel5_rand_ag_250_st2_0.25.yaml
  wrapper_config_file: hrl/8.h/8.h.c_hrl_wrapper_{replicate_signature}.yaml
  model_config_file: rl/ppo_dict_512_20M.yaml
