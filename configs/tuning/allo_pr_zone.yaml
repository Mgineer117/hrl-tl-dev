study_name: allo_pretrain_zone
db_filename: allo_pretrain_zone.db
db_dir: db
total_timesteps: 100000
direction: minimize
metric: loss/total
n_trials: 20
n_startup_trials: 5
n_evaluations: 10
n_eval_episodes: 1
n_jobs: 3
parallel_backend: process
launch_dashboard: false
dashboard_port: 8082

tune_params:
  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 1.0e-8
    high: 1.0e-5
    log: true

  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: categorical
    choices: [1000, 2000, 4000]

  - name: pair_horizon
    target: algo_kwargs.pair_horizon
    suggest_type: categorical
    choices: [25, 50, 100]

  - name: gamma_pairs
    target: algo_kwargs.gamma_pairs
    suggest_type: categorical
    choices: [0.8, 0.9, 0.95]

  - name: lr_duals
    target: algo_kwargs.lr_duals
    suggest_type: float
    low: 1.0e-6
    high: 1.0e-4
    log: true

  - name: lr_barrier_coeff
    target: algo_kwargs.lr_barrier_coeff
    suggest_type: float
    low: 1.0e-6
    high: 1.0e-4
    log: true

  - name: barrier_init
    target: algo_kwargs.barrier_init
    suggest_type: categorical
    choices: [0.01, 0.1, 1.0]
