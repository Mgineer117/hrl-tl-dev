study_name: allo_hl_fetch
db_filename: allo_hl_fetch.db
db_dir: db
total_timesteps: 500000
n_trials: 20
n_startup_trials: 5
n_evaluations: 5
n_eval_episodes: 100
n_jobs: 1
parallel_backend: process
launch_dashboard: false
dashboard_port: 8080

tune_params:
  - name: max_option_steps
    target: wrapper_kwargs.max_option_steps
    suggest_type: int
    low: 10
    high: 100

  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: int
    low: 1000
    high: 4000
    step: 1000

  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 0.00001
    high: 0.001
    log: true

  - name: n_epochs
    target: algo_kwargs.n_epochs
    suggest_type: int
    low: 10
    high: 40
    step: 10

  - name: gae_lambda
    target: algo_kwargs.gae_lambda
    suggest_type: float
    low: 0.9
    high: 1.0

  - name: clip_range
    target: algo_kwargs.clip_range
    suggest_type: float
    low: 0.0
    high: 1.0

  - name: gamma
    target: algo_kwargs.gamma
    suggest_type: float
    low: 0.9
    high: 1.0

  - name: ent_coef
    target: algo_kwargs.ent_coef
    suggest_type: float
    low: 0.0
    high: 0.1

  - name: vf_coef
    target: algo_kwargs.vf_coef
    suggest_type: float
    low: 0.1
    high: 1.0

  - name: max_grad_norm
    target: algo_kwargs.max_grad_norm
    suggest_type: float
    low: 0.1
    high: 1.0
