study_name: cpc_hl_fetch
db_filename: cpc_hl_fetch.db
db_dir: db
total_timesteps: 1000000
n_trials: 20
n_startup_trials: 5
n_evaluations: 5
n_eval_episodes: 100
n_jobs: 1
parallel_backend: process
launch_dashboard: false
dashboard_port: 8080

tune_params:
  - name: max_low_level_policy_steps
    target: wrapper_kwargs.max_low_level_policy_steps
    suggest_type: int
    low: 10
    high: 100

  - name: L_gain_min
    target: wrapper_kwargs.spec_rep_args.args.L_gain.range.0
    suggest_type: float
    low: 0.0
    high: 7.5

  - name: L_gain_max
    target: wrapper_kwargs.spec_rep_args.args.L_gain.range.1
    suggest_type: float
    low: 7.5
    high: 15.0

  - name: L_gain_bins
    target: wrapper_kwargs.spec_rep_args.args.L_gain.num_discrete_bins
    suggest_type: int
    low: 1
    high: 50

  - name: k_steepness_min
    target: wrapper_kwargs.spec_rep_args.args.k_steepness.range.0
    suggest_type: float
    low: 0.0
    high: 0.25

  - name: k_steepness_max
    target: wrapper_kwargs.spec_rep_args.args.k_steepness.range.1
    suggest_type: float
    low: 0.25
    high: 0.5

  - name: k_steepness_bins
    target: wrapper_kwargs.spec_rep_args.args.k_steepness.num_discrete_bins
    suggest_type: int
    low: 1
    high: 50

  - name: eps_margin_min
    target: wrapper_kwargs.spec_rep_args.args.eps_margin.range.0
    suggest_type: float
    low: 0.0
    high: 2.5

  - name: eps_margin_max
    target: wrapper_kwargs.spec_rep_args.args.eps_margin.range.1
    suggest_type: float
    low: 2.5
    high: 5.0

  - name: eps_margin_bins
    target: wrapper_kwargs.spec_rep_args.args.eps_margin.num_discrete_bins
    suggest_type: int
    low: 1
    high: 50

  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: categorical
    choices: [1000, 2000, 4000, 8000]

  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 0.00001
    high: 0.001
    log: true

  - name: n_epochs
    target: algo_kwargs.n_epochs
    suggest_type: categorical
    choices: [10, 20, 40]
