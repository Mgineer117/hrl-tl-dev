study_name: ppo_fetch
db_filename: ppo_fetch.db
db_dir: db
total_timesteps: 1000000
n_trials: 20
n_startup_trials: 5
n_evaluations: 5
n_eval_episodes: 100
n_jobs: 2
parallel_backend: process
launch_dashboard: false
dashboard_port: 8080

tune_params:
  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: categorical
    choices: [1000, 2000, 4000, 8000]

  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 0.00001
    high: 0.001
    log: true

  - name: n_epochs
    target: algo_kwargs.n_epochs
    suggest_type: categorical
    choices: [10, 20, 40]

  - name: gae_lambda
    target: algo_kwargs.gae_lambda
    suggest_type: float
    low: 0.9
    high: 1.0

  - name: clip_range
    target: algo_kwargs.clip_range
    suggest_type: float
    low: 0.0
    high: 1.0

  - name: gamma
    target: algo_kwargs.gamma
    suggest_type: float
    low: 0.9
    high: 1.0

  - name: ent_coef
    target: algo_kwargs.ent_coef
    suggest_type: float
    low: 0.0
    high: 0.1

  - name: vf_coef
    target: algo_kwargs.vf_coef
    suggest_type: float
    low: 0.1
    high: 1.0

  - name: max_grad_norm
    target: algo_kwargs.max_grad_norm
    suggest_type: float
    low: 0.1
    high: 1.0
