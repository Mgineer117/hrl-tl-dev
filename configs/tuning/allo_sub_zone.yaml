study_name: allo_subpolicy_zone
db_filename: allo_subpolicy_zone.db
db_dir: db
total_timesteps: 1000000
direction: maximize
metric: mean_reward
n_trials: 5
n_startup_trials: 5
n_evaluations: 5
n_eval_episodes: 100
n_jobs: 2
parallel_backend: process
launch_dashboard: false
dashboard_port: 8081

tune_params:
  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: categorical
    choices: [1000, 2000, 4000, 8000]

  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 1.0e-5
    high: 1.0e-3
    log: true

  - name: n_epochs
    target: algo_kwargs.n_epochs
    suggest_type: categorical
    choices: [10, 20, 40]

  - name: clip_range
    target: algo_kwargs.clip_range
    suggest_type: categorical
    choices: [0.1, 0.2, 0.3]
