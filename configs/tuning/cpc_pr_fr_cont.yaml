study_name: cpc_pr_fr_cont
db_filename: cpc_pr_fr_cont.db
db_dir: db
total_timesteps: 1000000
n_trials: 20
n_startup_trials: 5
n_evaluations: 5
n_eval_episodes: 100
n_jobs: 4
parallel_backend: process
launch_dashboard: false
dashboard_port: 8080

tune_params:
  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: categorical
    choices: [1000, 2000, 4000, 8000]

  - name: target_entropy
    target: algo_kwargs.target_entropy
    suggest_type: categorical
    choices: [0.25, 0.5, 0.75, 1.0, "auto"]

  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 0.00001
    high: 0.001
    log: true

  - name: tau
    target: algo_kwargs.tau
    suggest_type: categorical
    choices: [0.005, 0.01, 0.02]

  - name: target_update_interval
    target: algo_kwargs.target_update_interval
    suggest_type: categorical
    choices: [1, 10, 25]
