study_name: gcltl_hl_fetch
db_filename: gcltl_hl_fetch.db
db_dir: db
total_timesteps: 1000000
n_trials: 20
n_startup_trials: 5
n_evaluations: 5
n_eval_episodes: 100
n_jobs: 1
parallel_backend: process
launch_dashboard: false
dashboard_port: 8080

tune_params:
  - name: switch_threshold_min
    target: wrapper_kwargs.spec_rep_args.args.switch_threshold.range.0
    suggest_type: float
    low: -50.0
    high: 0.0

  - name: switch_threshold_max
    target: wrapper_kwargs.spec_rep_args.args.switch_threshold.range.1
    suggest_type: float
    low: 0.0
    high: 50.0

  - name: switch_threshold_bins
    target: wrapper_kwargs.spec_rep_args.args.switch_threshold.num_discrete_bins
    suggest_type: int
    low: 1
    high: 50

  - name: max_low_level_policy_steps
    target: wrapper_kwargs.max_low_level_policy_steps
    suggest_type: int
    low: 10
    high: 100

  - name: batch_size
    target: algo_kwargs.batch_size
    suggest_type: categorical
    choices: [1000, 2000, 4000, 8000]

  - name: learning_rate
    target: algo_kwargs.learning_rate
    suggest_type: float
    low: 0.00001
    high: 0.001
    log: true

  - name: n_epochs
    target: algo_kwargs.n_epochs
    suggest_type: categorical
    choices: [10, 20, 40]
